name: cloudnest

services:
  # --- Database -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cloudnest-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-genai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genai} -d ${POSTGRES_DB:-genai}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --- Redis (rate limiting) ------------------------------------------------
  # Backs app/core/rate_limit.py. No persistence needed — these are ephemeral
  # request counters, so AOF/RDB are disabled to keep it lightweight.
  redis:
    image: redis:7-alpine
    container_name: cloudnest-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # --- Ollama (local LLM) ---------------------------------------------------
  ollama:
    # Pinned so `docker compose pull` cannot silently change the runtime.
    image: ollama/ollama:0.40.13
    container_name: cloudnest-ollama
    # Optional: only started with `--profile ollama` (LLM_PROVIDER=ollama).
    # Groq/OpenRouter setups do not need it, and `api` does not wait for it.
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # One-shot: pull the default model on first start, then exit.
  ollama-pull:
    image: ollama/ollama:0.40.13
    container_name: cloudnest-ollama-pull
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - ../.env
    entrypoint: >
      /bin/sh -c "if [ -n \"$${OLLAMA_CHAT_MODEL}\" ]; then
                    OLLAMA_HOST=http://ollama:11434 ollama pull $${OLLAMA_CHAT_MODEL};
                  fi &&
                  if [ -n \"$${OLLAMA_VISION_MODEL}\" ]; then
                    OLLAMA_HOST=http://ollama:11434 ollama pull $${OLLAMA_VISION_MODEL};
                  fi"
    restart: "no"

  # --- Weaviate (vector store, native multi-tenancy) -----------------------
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.6
    container_name: cloudnest-weaviate
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      # We bring our own BGE vectors, so no vectorizer module is enabled.
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped


  # --- Backend (FastAPI) ----------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile-backend
    container_name: cloudnest-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      # Service-name overrides (these WIN over .env because Docker networking
      # uses service names, not localhost). Everything else - API keys, JWT
      # secret, OAuth creds, SMTP, Langfuse - comes from ../.env via env_file.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-genai}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-genai}
      OLLAMA_BASE_URL: http://ollama:11434
      WEAVIATE_URL: http://weaviate:8080
      WEAVIATE_GRPC_PORT: "50051"
      REDIS_URL: redis://redis:6379/0
      BACKEND_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      HF_HOME: /cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - hf_cache:/cache/huggingface
    restart: unless-stopped

  # --- Frontend (Next.js) ---------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile-frontend
      args:
        # Browser-reachable backend URL, inlined at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: cloudnest-frontend
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  hf_cache:
  weaviate_data: