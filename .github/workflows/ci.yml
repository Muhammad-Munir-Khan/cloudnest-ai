name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    # Real Weaviate for tests/integration (tenant isolation). Same image and
    # settings as docker/docker-compose.yml; the tests skip if it is missing.
    services:
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.27.6
        ports:
          - 8080:8080
          - 50051:50051
        env:
          DEFAULT_VECTORIZER_MODULE: none
          ENABLE_MODULES: ""
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          CLUSTER_HOSTNAME: node1
        options: >-
          --health-cmd "wget -qO- http://localhost:8080/v1/.well-known/ready"
          --health-interval 5s --health-timeout 5s --health-retries 12
      # Throwaway Postgres for tests/integration/test_session_list.py (it
      # creates and drops all tables, so it only runs when TEST_DATABASE_URL is set).
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # CPU-only torch first, as in docker/Dockerfile-backend: the default
      # PyPI wheel pulls gigabytes of CUDA libraries the tests never use.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
      - run: pip install -r requirements-dev.txt
      # Settings has ~58 required fields; the template must stay complete.
      - run: cp .env.example .env
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/test

  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.10
      - run: ruff check app tests

  frontend-build:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-lint:
    # Lint runs here, not in the build (next.config.ts sets ignoreDuringBuilds).
    name: Frontend lint (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  docker-build:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile-${{ matrix.image }} -t cloudnest-${{ matrix.image }}:ci .
