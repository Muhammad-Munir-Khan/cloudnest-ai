name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # CPU-only torch first, as in docker/Dockerfile-backend: the default
      # PyPI wheel pulls gigabytes of CUDA libraries the tests never use.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
      - run: pip install -r requirements-dev.txt
      # Settings has ~58 required fields; the template must stay complete.
      - run: cp .env.example .env
      - run: pytest

  backend-lint:
    # Report-only until the existing findings are cleaned up (planner
    # LINT-01); then remove continue-on-error to make it blocking.
    name: Backend lint (ruff, report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.10
      - run: ruff check app tests

  frontend-build:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-lint:
    # Report-only until LINT-01 (next.config.ts skips ESLint during builds).
    name: Frontend lint (ESLint, report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  docker-build:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile-${{ matrix.image }} -t cloudnest-${{ matrix.image }}:ci .
