[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and form/file params as call defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.params.Depends",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
